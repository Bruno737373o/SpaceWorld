name: Build SpaceWorld Mobile (Android)

on: [push, pull_request]

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-android:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b

    - name: Compilar com CMake e Android NDK
      run: |
        mkdir -p build_${{ matrix.abi }}
        cd build_${{ matrix.abi }}
        
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }}

        cmake --build . --config ${{ env.BUILD_CONFIGURATION }}

    - name: Upload do Artefato Compilado
      uses: actions/upload-artifact@v4
      with:
        name: SpaceWorld_android_${{ matrix.abi }}
        path: build_${{ matrix.abi }}/SpaceWorld*
        retention-days: 14
        
