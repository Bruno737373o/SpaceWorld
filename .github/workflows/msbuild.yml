name: Build SpaceWorld Mobile (Android)

on: [push, pull_request]

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-android:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b

    - name: Aplicar patch de compatibilidade do Windows para Linux/Android
      run: |
        python3 -c '
        import os

        shim = """
        #ifndef _WIN32
        #include <chrono>
        #include <cmath>
        #include <cstdint>

        typedef uint32_t DWORD;

        inline uint32_t timeGetTime() {
            using namespace std::chrono;
            return static_cast<uint32_t>(duration_cast<milliseconds>(steady_clock::now().time_since_epoch()).count());
        }

        inline int _fpclass(double val) {
            if (std::isnan(val) || std::isinf(val)) {
                return 0x0001;
            }
            return 0;
        }
        #endif
        """

        for root, dirs, files in os.walk("."):
            for file in files:
                if file in ["world.h", "main.cpp", "audio_io.cpp"]:
                    filepath = os.path.join(root, file)
                    with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                        content = f.read()
                    
                    if file == "world.h":
                        content = content.replace("#include <windows.h>", "#ifdef _WIN32\n#include <windows.h>\n#endif")
                    
                    if "#ifndef _WIN32" not in content:
                        content = shim + "\n" + content
                        
                    with open(filepath, "w", encoding="utf-8") as f:
                        f.write(content)
        '

    - name: Compilar com CMake e Android NDK
      run: |
        mkdir -p build_${{ matrix.abi }}
        cd build_${{ matrix.abi }}
        
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }}

        cmake --build . --config ${{ env.BUILD_CONFIGURATION }}

    - name: Upload do Artefato Compilado
      uses: actions/upload-artifact@v4
      with:
        name: SpaceWorld_android_${{ matrix.abi }}
        path: build_${{ matrix.abi }}/SpaceWorld*
        retention-days: 14
        
